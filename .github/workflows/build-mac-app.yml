name: Build Mac app

on:
  push:
    branches: ["main", "claude/**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # to publish the .dmg on a release when a v* tag is pushed

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # python.org's installer is "universal2", so the app runs on both
      # Apple Silicon and Intel Macs.
      - name: Install Python 3.12 (universal2)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/python.pkg" https://www.python.org/ftp/python/3.12.7/python-3.12.7-macos11.pkg
          sudo installer -pkg "$RUNNER_TEMP/python.pkg" -target /
          echo "PYTHON=/Library/Frameworks/Python.framework/Versions/3.12/bin/python3" >> "$GITHUB_ENV"

      - name: Run tests
        run: '"$PYTHON" -m unittest -v'

      - name: Build app and disk image
        env:
          TARGET_ARCH: universal2
        run: packaging/build_mac_app.sh

      - name: Smoke test the built app
        run: packaging/smoke_test.sh

      - name: Show app log on failure
        if: failure()
        run: cat "$HOME/Library/Logs/Super Gemini Librarian.log" || true

      - uses: actions/upload-artifact@v4
        with:
          name: Super-Gemini-Librarian-mac
          path: dist/*.dmg
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg
